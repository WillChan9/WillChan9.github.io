<svg id="visual" viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
  <!-- Adaptive background - transparent/neutral -->
  <defs>
    <linearGradient id="adaptive-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:transparent;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:transparent;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Transparent background that adapts to theme -->
  <rect width="960" height="540" fill="url(#adaptive-gradient)"/>
</svg> 