<svg id="visual" viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4da6ff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#3399ff;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="960" height="540" fill="url(#bg-gradient)"/>
  
  <!-- Geometric patterns -->
  <g opacity="0.1">
    <!-- Grid pattern -->
    <path d="M0 0 L960 0 M0 60 L960 60 M0 120 L960 120 M0 180 L960 180 M0 240 L960 240 M0 300 L960 300 M0 360 L960 360 M0 420 L960 420 M0 480 L960 480 M0 540 L960 540" stroke="#4da6ff" stroke-width="1"/>
    <path d="M0 0 L0 540 M120 0 L120 540 M240 0 L240 540 M360 0 L360 540 M480 0 L480 540 M600 0 L600 540 M720 0 L720 540 M840 0 L840 540 M960 0 L960 540" stroke="#4da6ff" stroke-width="1"/>
    
    <!-- Floating geometric shapes -->
    <circle cx="200" cy="150" r="40" fill="url(#accent-gradient)"/>
    <circle cx="800" cy="400" r="60" fill="url(#accent-gradient)"/>
    <rect x="700" y="100" width="80" height="80" fill="url(#accent-gradient)" opacity="0.2"/>
    <polygon points="100,400 150,350 200,400 150,450" fill="url(#accent-gradient)" opacity="0.3"/>
    
    <!-- Circuit-like lines -->
    <path d="M50 200 Q200 150 350 200 T650 200 T950 200" stroke="#4da6ff" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M50 350 Q200 300 350 350 T650 350 T950 350" stroke="#4da6ff" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Subtle dots pattern -->
  <g opacity="0.2">
    <circle cx="150" cy="80" r="2" fill="#4da6ff"/>
    <circle cx="300" cy="120" r="2" fill="#4da6ff"/>
    <circle cx="450" cy="90" r="2" fill="#4da6ff"/>
    <circle cx="600" cy="150" r="2" fill="#4da6ff"/>
    <circle cx="750" cy="110" r="2" fill="#4da6ff"/>
    <circle cx="900" cy="140" r="2" fill="#4da6ff"/>
    <circle cx="200" cy="460" r="2" fill="#4da6ff"/>
    <circle cx="350" cy="420" r="2" fill="#4da6ff"/>
    <circle cx="500" cy="450" r="2" fill="#4da6ff"/>
    <circle cx="650" cy="480" r="2" fill="#4da6ff"/>
    <circle cx="800" cy="440" r="2" fill="#4da6ff"/>
  </g>
</svg> 